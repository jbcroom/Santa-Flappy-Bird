<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Santa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div id="startScreen" class="screen">
            <h1>Flappy Santa</h1>
            <p>Click or press Space to fly!</p>
            <div class="speed-control">
                <label for="speedSelect">Game Speed:</label>
                <select id="speedSelect">
                    <option value="0.5">Slow (0.5x)</option>
                    <option value="1" selected>Normal (1x)</option>
                    <option value="1.5">Fast (1.5x)</option>
                    <option value="2">Insane (2x)</option>
                </select>
            </div>
            <button id="startButton">Start Game</button>
        </div>
        <div id="gameOverScreen" class="screen hidden">
            <h1>Game Over!</h1>
            <p>Score: <span id="finalScore">0</span></p>
            <button id="restartButton">Play Again</button>
        </div>
        <div id="score" class="hidden">0</div>
        <div id="speedIndicator" class="hidden">Speed: 1x</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
